[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "simap-industrial-policy-engine"
version = "0.1.0"
description = "Sandbox industrial context-aware policy-to-session demonstrator"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "fastapi>=0.110,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
simap-demo = "simap.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
